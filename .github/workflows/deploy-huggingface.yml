# Mirrors every push to master into a Hugging Face Docker Space.
# Setup (once): repo Settings → Secrets and variables → Actions
#   secret   HF_TOKEN  = a Hugging Face access token with write permission
#   variable HF_SPACE  = <hf-username>/<space-name>, e.g. jane/lawlens
name: Deploy to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Space metadata to README
        run: |
          {
            printf -- '---\ntitle: LawLens\nemoji: ⚖️\ncolorFrom: blue\ncolorTo: indigo\nsdk: docker\napp_port: 7860\npinned: false\nshort_description: Search and read state and federal US laws\n---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Hugging Face Space metadata"

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
